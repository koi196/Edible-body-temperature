<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>再次拥有你的体温</title>
<style>
  :root{
    --bg:#080b12;
    --panel:rgba(22,28,43,.82);
    --border:rgba(255,255,255,.09);
    --text:#e8e6e1;
    --muted:#9aa0ae;
    --accent:#7aa2f7;
    --gold:#e6c88a;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;min-height:100%;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
    background:
      radial-gradient(900px 500px at 50% -10%, #1c2740 0%, transparent 70%),
      radial-gradient(700px 400px at 100% 100%, #1a1630 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    position:relative;
    overflow:hidden;
    width:100%;
    max-width:700px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:34px 32px 30px;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    animation:fadeUp .5s ease both;
  }

  /* ===== 结局背景水印文字 ===== */
  #bg-watermark{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
    font-size:24px;
    font-weight:800;
    letter-spacing:.12em;
    line-height:2.2;
    padding:12px;
    word-break:break-all;
    user-select:none;
    color:rgba(200,210,230,.045);
    text-shadow:none;
  }
  #bg-watermark.hidden{display:none !important;}

  /* ===== 火焰燃烧动画 ===== */
  #burn-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    pointer-events:none;
    display:none;
  }
  #burn-overlay.active{display:block;}

  #burn-canvas{
    display:block;
    width:100vw;
    height:100vh;
    position:absolute;
    inset:0;
  }

  @keyframes shakeScreen{
    0%, 100%{ transform:translate(0,0) rotate(0); }
    10%{ transform:translate(-6px,4px) rotate(-.5deg); }
    20%{ transform:translate(6px,-4px) rotate(.5deg); }
    30%{ transform:translate(-5px,-3px) rotate(-.4deg); }
    40%{ transform:translate(5px,3px) rotate(.4deg); }
    50%{ transform:translate(-4px,2px) rotate(-.3deg); }
    60%{ transform:translate(4px,-2px) rotate(.3deg); }
    70%{ transform:translate(-3px,3px) rotate(-.2deg); }
    80%{ transform:translate(3px,-3px) rotate(.2deg); }
    90%{ transform:translate(-2px,2px) rotate(-.1deg); }
  }

  #app.shake{
    animation:shakeScreen .4s cubic-bezier(.36,.07,.19,.97) both infinite;
  }

  #float-layer{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    border-radius:inherit;
    pointer-events:none;
  }

  .whisper{
    position:absolute;
    white-space:nowrap;
    font-weight:600;
    letter-spacing:.12em;
    color:rgba(230,200,138,.42);
    text-shadow:
      0 0 14px rgba(230,200,138,.35),
      0 0 30px rgba(230,200,138,.15);
    opacity:0;
    transition:opacity .9s ease;
    transform:translate(-50%,-50%) rotate(var(--rot,0deg));
    animation:whisperFloat var(--dur,5s) ease-in-out var(--delay,0s) infinite alternate;
    will-change:transform;
    user-select:none;
  }

  @keyframes whisperFloat{
    from{ transform:translate(-50%,-50%) rotate(var(--rot,0deg)) translate(0,0); }
    to{   transform:translate(-50%,-50%) rotate(var(--rot,0deg)) translate(var(--dx,0px), var(--dy,0px)); }
  }

  /* ===== C 路线：红色困倦漂浮文字 ===== */
  .c-tired-whisper{
    position:fixed;
    z-index:1500;
    pointer-events:none;
    white-space:nowrap;
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
    font-weight:800;
    letter-spacing:.18em;
    color:#e53935;
    text-shadow:
      0 0 10px rgba(229,57,53,.75),
      0 0 26px rgba(229,57,53,.45);
    transform:translate(-50%,-50%);
    animation:cTiredFloat 8s ease-out forwards;
  }

  @keyframes cTiredFloat{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.82); }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.04); }
    65%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%, calc(-50% - 90px)) scale(1); }
  }

  /* ===== 学生手册 可点击文字 ===== */
  .handbook-link{
    color:#4caf50;
    cursor:pointer;
    transition:opacity .2s, text-shadow .2s;
  }
  .handbook-link:hover{
    opacity:.85;
    text-shadow:0 0 6px rgba(76,175,80,.5);
  }
  .handbook-link-pink{ color:#ff69b4; }
  .handbook-link-pink:hover{ text-shadow:0 0 6px rgba(255,105,180,.55); }
  .handbook-link-gold{ color:#c9a227; }
  .handbook-link-gold:hover{ text-shadow:0 0 6px rgba(201,162,39,.55); }

  #game,#ending,#eight-ending{ position:relative; z-index:1; }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    letter-spacing:.18em;
    color:var(--muted);
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;
    margin-bottom:12px;
  }

  .progress-track{
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
    margin-bottom:26px;
  }

  .progress-fill{
    height:100%;
    width:0;
    border-radius:3px;
    background:linear-gradient(90deg,#4d7cfe,#b07cff);
    box-shadow:0 0 12px rgba(122,162,247,.7);
    transition:width .55s cubic-bezier(.4,0,.2,1);

  #content{transition:opacity .2s ease;}
  #content.is-fading{opacity:0;}

  .chapter-title{
    font-size:21px;

  .name-link{

    padding:0;
    font:inherit;
    cursor:pointer;
    transition:opacity .2s, text-shadow .2s;
    text-shadow:

  .name-link:hover{

    text-shadow:

    gap:11px;

  .option{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:15px 18px;
    font-family:inherit;
    font-size:15px;
    line-height:1.6;
    text-align:left;
    color:#d6d3cd;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    border-radius:13px;
    cursor:pointer;
    transition:background .22s, border-color .22s, transform .22s, color .22s;
    animation:fadeUp .45s ease both;

  .option:hover{
    background:rgba(122,162,247,.13);
    border-color:rgba(122,162,247,.55);
    color:#fff;
    transform:translateX(5px);
  }

  .option:active{transform:translateX(5px) scale(.995);}

    animation:denyShake .4s ease both;
  }

  @keyframes denyShake{
    0%,100%{transform:translateX(0);border-color:var(--border);}
    25%{transform:translateX(-3px);border-color:rgba(230,130,130,.65);}
    75%{transform:translateX(3px);border-color:rgba(230,130,130,.65);}
  }

  .opt-num{
    flex:none;
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    border-radius:50%;
    font-size:12px;
    font-family:ui-sans-serif,system-ui,sans-serif;

  .continue-wrap{

  .continue-btn{

    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;

  #toast{
    position:fixed;
    right:28px;
    bottom:28px;
    z-index:1100;
    background:#ffffff;
    color:#0a7a2f;
    font-weight:600;
    font-size:15px;

    text-align:left;
    animation:toastIn .3s ease both;

  }

  #toast.item-toast{
    color:#000000;
  }

  #toast.toast-left{
    left:28px;
    right:auto;
  }

  #toast.hidden{display:none !important;}

  @keyframes toastIn{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:none;}
  }

  @keyframes popupFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popupScaleIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}

  #glitch-overlay{

      rgba(0,0,0,.4);
    animation:glitchShift .12s steps(2,end) infinite;
    mix-blend-mode:screen;
  }

  #glitch-overlay::before,
  #glitch-overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background: inherit;
    mix-blend-mode: difference;
  }

  #glitch-overlay::before {
    left: 10px;
    background: rgba(255, 0, 0, 0.35);
    animation: glitchShift1 0.15s steps(3,end) infinite;
  }

  #glitch-overlay::after {
    left: -10px;
    background: rgba(0, 255, 255, 0.35);
    animation: glitchShift2 0.18s steps(2,end) infinite;
  }

  #glitch-overlay.hidden{display:none !important;}

  @keyframes glitchShift{
    0%{transform:translate(0,0) scale(1);}
    20%{transform:translate(-15px,8px) scale(1.05);}
    40%{transform:translate(15px,-8px) scale(0.95);}
    60%{transform:translate(-8px,-15px) scale(1.02);}
    80%{transform:translate(8px,15px) scale(0.98);}
    100%{transform:translate(0,0) scale(1);}
  }

const NAME_LIST = ['卡芙卡','三月七','星期日','瓦尔特','丹恒','流萤','姬子','银狼','刃','黑猫'];

function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function escapeRegExp(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

const NAME_PATTERN = new RegExp(
  NAME_LIST.map(escapeRegExp).join('|'),
  'g'
);

const ALLOWED_NAMES_BY_CHAPTER = {
  'A0':   ['卡芙卡'],
  'A1b':  ['丹恒','刃'],
  'A2':   ['三月七','流萤'],
  'A3':   ['星期日','银狼'],
  'A4':   ['瓦尔特','黑猫'],
  'B0':   ['姬子'],
  'B1_5': ['丹恒','刃'],
  'B2':   ['三月七','流萤'],
  'B3':   ['星期日','银狼'],
  'B4':   ['瓦尔特','黑猫'],
};

function renderClickableNames(text){
  let html = escapeHtml(applyName(text));
  const allowed = ALLOWED_NAMES_BY_CHAPTER[state.currentId] || [];

  const namesToLink = allowed.filter(n => n !== '黑猫');
  if (namesToLink.length > 0){
    const pattern = new RegExp(namesToLink.map(escapeRegExp).join('|'), 'g');
    html = html.replace(pattern, (m) => {
      return `<span class="name-link" data-name="${m}">${m}</span>`;
    });
  }

  if (allowed.includes('黑猫')){
    html = html.replace(/黑猫/g, '<span class="name-link" data-name="黑猫">黑猫</span>');
  }

  html = html.replace(/\{\{HANDBOOK_PINK\}\}/g, '<span class="handbook-link handbook-link-pink">学生手册</span>');
  html = html.replace(/\{\{HANDBOOK_GOLD\}\}/g, '<span class="handbook-link handbook-link-gold">学生手册</span>');
  html = html.replace(/\{\{HANDBOOK\}\}/g, '<span class="handbook-link">学生手册</span>');
  return html;
}


function openNamePopup(name){
  nameClickCounts[name] = (nameClickCounts[name] || 0) + 1;
  const count = nameClickCounts[name];

  currentNamePopupCharacter = name;

  const raw = DATA.namePopups && DATA.namePopups[name];
  let content;

  if (Array.isArray(raw) && raw.length > 0) {
    content = raw[Math.floor(Math.random() * raw.length)];
  } else if (typeof raw === 'string') {
    content = raw;
  } else {
    content = `【${name} 的弹窗内容 · 由你填写】`;
  }

  const color = (DATA.nameColors && DATA.nameColors[name]) || '#000000';

  els.namePopupText.textContent = content;
  els.namePopupText.style.color = color;

  const showOptions =

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  const lines = [];
  const paragraphs = String(text).split('\n');
  for (const para of paragraphs){
    if (para === ''){ lines.push(''); continue; }
    let current = '';
    for (const char of para){
      const test = current + char;
      if (ctx.measureText(test).width > maxWidth && current !== ''){
        lines.push(current);
        current = char;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
  }
  return lines;
}

function drawPaper(ctx, w, h, titleText, kindText, bodyText){
  const bgGrad = ctx.createRadialGradient(w/2, h*0.1, 0, w/2, h*0.1, Math.max(w, h)*0.8);
  bgGrad.addColorStop(0, '#1c2740');
  bgGrad.addColorStop(0.7, '#0b0f18');
  bgGrad.addColorStop(1, '#080b12');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  const isMobile = w < 520;
  const panelW = Math.min(isMobile ? w - 28 : 700, w - 36);
  const panelX = (w - panelW) / 2;
  const panelY = Math.max(20, h * 0.06);
  const panelH = Math.min(h - panelY * 2, 720);
  const panelPad = isMobile ? 22 : 32;
  const contentW = panelW - panelPad * 2;

  ctx.save();
  roundRect(ctx, panelX, panelY, panelW, panelH, isMobile ? 16 : 20);
  ctx.fillStyle = 'rgba(22,28,43,0.94)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  let cursorY = panelY + 28;

  if (kindText){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#e6c88a';
    ctx.font = (isMobile ? 11 : 12) + 'px ui-sans-serif, system-ui, sans-serif';
    const kw = ctx.measureText(kindText).width + 32;
    const kh = 22;
    const kx = w/2 - kw/2;
    roundRect(ctx, kx, cursorY, kw, kh, 11);
    ctx.fillStyle = 'rgba(230,200,138,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(230,200,138,0.35)';
    ctx.stroke();
    ctx.fillStyle = '#e6c88a';
    ctx.textBaseline = 'middle';
    ctx.fillText(kindText, w/2, cursorY + kh/2);
    cursorY += kh + 18;
  }

  if (titleText){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#e6c88a';
    ctx.font = 'bold ' + (isMobile ? 19 : 23) + 'px "Noto Serif SC", "Songti SC", serif';
    const titleLines = wrapText(ctx, titleText, contentW);
    for (const line of titleLines){
      ctx.fillText(line, w/2, cursorY);
      cursorY += (isMobile ? 26 : 30);
    }
    cursorY += 10;
  }

  if (bodyText){
    ctx.fillStyle = '#cbc8c2';
    ctx.font = (isMobile ? 14 : 15) + 'px "Noto Serif SC", "Songti SC", serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const bodyLines = wrapText(ctx, bodyText, contentW);
    const maxLines = 14;
    const lineH = isMobile ? 22 : 24;
    for (let i = 0; i < Math.min(bodyLines.length, maxLines); i++){
      if (cursorY + lineH > panelY + panelH - 80) break;
      ctx.fillText(bodyLines[i], panelX + panelPad, cursorY);
      cursorY += lineH;
    }
    if (bodyLines.length > maxLines){
      ctx.fillStyle = '#9aa0ae';
      if (cursorY + lineH <= panelY + panelH - 80){
        ctx.fillText('……', panelX + panelPad, cursorY);
      }
    }
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const btnW = 140;
  const btnH = 40;
  const btnX = (w - btnW) / 2;
  const btnY = panelY + panelH - 60;
  roundRect(ctx, btnX, btnY, btnW, btnH, 20);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#cfd5e3';
  ctx.font = '13px "Noto Serif SC", "Songti SC", serif';
  ctx.fillText('重 新 开 始', w/2, btnY + btnH/2);
}

function playBurnAnimation(titleText, kindText, bodyText, onComplete){
  if (burnPlaying) return;
  burnPlaying = true;

  const overlay = els.burnOverlay;
  overlay.classList.add('active');
  overlay.innerHTML = '';

  const canvas = document.createElement('canvas');
  canvas.id = 'burn-canvas';
  overlay.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const resolution = 220;
  const noisePoints = [];
  for (let i = 0; i < resolution; i++){
    noisePoints.push({
      n1: Math.random() * Math.PI * 2,
      n2: Math.random() * Math.PI * 2,
      n3: Math.random() * Math.PI * 2
    });
  }

  const paperCanvas = document.createElement('canvas');
  paperCanvas.width = w * dpr;
  paperCanvas.height = h * dpr;
  const pctx = paperCanvas.getContext('2d');
  pctx.scale(dpr, dpr);
  drawPaper(pctx, w, h, titleText, kindText, bodyText);

  function getBurnY(x, progress, now){
    const baseY = h - (h + 160) * progress;
    const idx = Math.floor((x / w) * resolution);
    const p = noisePoints[Math.min(idx, resolution - 1)];
    const noise1 = Math.sin(x * 0.018 + p.n1) * 34;
    const noise2 = Math.sin(x * 0.047 + p.n2) * 20;
    const noise3 = Math.sin(x * 0.105 + p.n3) * 11;
    const wobble = Math.sin(x * 0.03 + now * 0.003) * 14;
    return baseY + (noise1 + noise2 + noise3 + wobble) * (0.4 + progress * 0.6);
  }

  const duration = 2800;
  const startTime = performance.now();
  const edgeSteps = 160;
  const flameSteps = 140;

  function drawFrame(now){
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);

    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(paperCanvas, 0, 0, w, h);

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.moveTo(-10, h + 20);
    for (let i = 0; i <= edgeSteps; i++){
      const x = (i / edgeSteps) * w;
      const y = getBurnY(x, t, now);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w + 10, h + 20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= edgeSteps; i++){
      const x = (i / edgeSteps) * w;
      const burnY = getBurnY(x, t, now);
      if (i === 0) ctx.moveTo(x, burnY - 24);
      else ctx.lineTo(x, burnY - 24);
    }
    for (let i = edgeSteps; i >= 0; i--){
      const x = (i / edgeSteps) * w;
      const burnY = getBurnY(x, t, now);
      ctx.lineTo(x, burnY + 2);
    }
    ctx.closePath();
    const edgeGrad = ctx.createLinearGradient(0, h, 0, 0);
    edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
    edgeGrad.addColorStop(0.6, 'rgba(8,6,4,0.55)');
    edgeGrad.addColorStop(1, 'rgba(12,9,6,0.92)');
    ctx.fillStyle = edgeGrad;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let layer = 0; layer < 3; layer++){
      const layerOffset = layer * 22;
      const alpha = 0.68 - layer * 0.14;

      ctx.beginPath();
      for (let i = 0; i <= flameSteps; i++){
        const x = (i / flameSteps) * w;
        const burnY = getBurnY(x, t, now);
        const idx = Math.floor((x / w) * resolution);
        const p = noisePoints[Math.min(idx, resolution - 1)];
        const spike1 = Math.sin(x * 0.07 + now * 0.008 + p.n1) * 0.5 + 0.5;
        const spike2 = Math.sin(x * 0.14 - now * 0.012 + p.n2) * 0.5 + 0.5;
        const spike3 = Math.sin(x * 0.035 + now * 0.005 + p.n3) * 0.5 + 0.5;
        const flameH = (spike1 * 0.5 + spike2 * 0.3 + spike3 * 0.2) * 110 * (0.35 + t * 0.65) + layerOffset;
        const flameY = burnY - flameH;
        if (i === 0) ctx.moveTo(x, flameY);
        else ctx.lineTo(x, flameY);
      }
      for (let i = flameSteps; i >= 0; i--){
        const x = (i / flameSteps) * w;
        const burnY = getBurnY(x, t, now);
        ctx.lineTo(x, burnY + 4);
      }
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0,    `rgba(0, 245, 255, ${alpha})`);
      grad.addColorStop(0.45, `rgba(0, 195, 255, ${alpha * 0.75})`);
      grad.addColorStop(0.8,  `rgba(0, 120, 255, ${alpha * 0.35})`);
      grad.addColorStop(1,    `rgba(0, 60, 220, 0)`);
      ctx.fillStyle = grad;

      ctx.shadowColor = 'rgba(0, 235, 255, 0.9)';
      ctx.shadowBlur = 38;
      ctx.fill();
    }

    for (let layer = 0; layer < 2; layer++){
      const layerOffset = layer * 9;
      const alpha = 0.5 - layer * 0.16;

      ctx.beginPath();
      for (let i = 0; i <= flameSteps; i++){
        const x = (i / flameSteps) * w;
        const burnY = getBurnY(x, t, now);
        const idx = Math.floor((x / w) * resolution);
        const p = noisePoints[Math.min(idx, resolution - 1)];
        const spike = Math.sin(x * 0.095 + now * 0.01 + p.n1) * 0.5 + 0.5;
        const spike2 = Math.sin(x * 0.04 - now * 0.007 + p.n3) * 0.5 + 0.5;
        const flameH = (spike * 0.6 + spike2 * 0.4) * 55 * (0.35 + t * 0.65) + layerOffset;
        const flameY = burnY - flameH;
        if (i === 0) ctx.moveTo(x, flameY);
        else ctx.lineTo(x, flameY);
      }
      for (let i = flameSteps; i >= 0; i--){
        const x = (i / flameSteps) * w;
        const burnY = getBurnY(x, t, now);
        ctx.lineTo(x, burnY + 2);
      }
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0,    `rgba(215, 245, 255, ${alpha})`);
      grad.addColorStop(0.6,  `rgba(175, 225, 250, ${alpha * 0.55})`);
      grad.addColorStop(1,    `rgba(135, 200, 245, 0)`);
      ctx.fillStyle = grad;

      ctx.shadowColor = 'rgba(190, 240, 255, 0.65)';
      ctx.shadowBlur = 18;
      ctx.fill();
    }

    ctx.restore();

    if (t < 1){
      requestAnimationFrame(drawFrame);
    } else {
      overlay.classList.remove('active');
      overlay.innerHTML = '';
      burnPlaying = false;
      if (typeof onComplete === 'function') onComplete();
    }
  }

  requestAnimationFrame(drawFrame);
}

function playClockRewindAnimation(onRestart, onComplete){
  if (clockPlaying) return;
  clockPlaying = true;

  const overlay = document.createElement('div');
  overlay.id = 'clock-overlay';
  overlay.style.position = 'fixed';
  overlay.style.inset = '0';
  overlay.style.zIndex = '3001';
  overlay.style.pointerEvents = 'none';
  document.body.appendChild(overlay);

  const canvas = document.createElement('canvas');
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  canvas.style.display = 'block';
  overlay.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const totalDuration = 2800;
  const restartAt = 2350;
  let restarted = false;

  const startTime = performance.now();

  function drawHand(angle, length, width, color){
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(-width / 2, 0);
    ctx.lineTo(-width / 2, -length);
    ctx.lineTo(width / 2, -length);
    ctx.lineTo(width / 2, 0);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
  }

  function drawFrame(now){
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / totalDuration);

    ctx.clearRect(0, 0, w, h);

    const bgAlpha = Math.min(0.6, (elapsed / 300) * 0.6);
    ctx.fillStyle = `rgba(0,0,0,${bgAlpha})`;
    ctx.fillRect(0, 0, w, h);

    const size = Math.min(w, h) * 0.72;
    const cx = w / 2;
    const cy = h / 2;
    const r = size / 2;
    const appear = Math.min(1, elapsed / 300);
    const easeAppear = 1 - Math.pow(1 - appear, 3);
    const scale = easeAppear;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(20,30,50,0.88)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,220,255,0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180,220,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    for (let i = 0; i < 60; i++){
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 5 === 0;
      const len = isMajor ? r * 0.08 : r * 0.04;
      const inner = r * 0.82;
      const outer = inner - len;
      const x1 = Math.cos(angle) * inner;
      const y1 = Math.sin(angle) * inner;
      const x2 = Math.cos(angle) * outer;
      const y2 = Math.sin(angle) * outer;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = isMajor ? 'rgba(200,230,255,0.6)' : 'rgba(200,230,255,0.2)';
      ctx.lineWidth = isMajor ? 2 : 1;
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.font = `bold ${r * 0.13}px "Noto Serif SC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 1; i <= 12; i++){
      const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const numR = r * 0.7;
      const x = Math.cos(angle) * numR;
      const y = Math.sin(angle) * numR;
      ctx.fillText(String(i), x, y);
    }

    const progress = Math.min(1, elapsed / 2000);
    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

    const secRotate = 1440 * ease;
    const minRotate = 360 * ease;
    const hourRotate = 120 * ease;

    const initialHour = (10 + 10 / 60) * 30;
    const initialMinute = 10 * 6;
    const initialSecond = 0;

    const hourAngle = (initialHour - hourRotate - 90) * Math.PI / 180;
    const minuteAngle = (initialMinute - minRotate - 90) * Math.PI / 180;
    const secondAngle = (initialSecond - secRotate - 90) * Math.PI / 180;

    drawHand(hourAngle, r * 0.45, r * 0.035, 'rgba(210,230,255,0.9)');
    drawHand(minuteAngle, r * 0.65, r * 0.025, 'rgba(210,230,255,0.95)');
    drawHand(secondAngle, r * 0.75, r * 0.012, 'rgba(120,220,255,1)');

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.035, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,230,255,0.95)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.015, 0, Math.PI * 2);
    ctx.fillStyle = '#0a1220';
    ctx.fill();

    ctx.restore();

    let flashAlpha = 0;
    if (elapsed > 2000){
      if (elapsed < 2400){
        flashAlpha = (elapsed - 2000) / 400;
      } else {
        flashAlpha = Math.max(0, 1 - (elapsed - 2400) / 400);
      }
    }
    if (flashAlpha > 0){
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, w, h);
    }

    if (!restarted && elapsed >= restartAt){
      restarted = true;
      if (typeof onRestart === 'function') onRestart();
    }

    if (elapsed < totalDuration){
      requestAnimationFrame(drawFrame);
    } else {
      overlay.remove();
      clockPlaying = false;
      if (typeof onComplete === 'function') onComplete();
    }
  }

  requestAnimationFrame(drawFrame);
}

  els.whitePopupBox.style.color = color || '#000000';
  els.whitePopupOverlay.style.zIndex = zIndex || '';

  els.whitePopupOverlay.classList.remove('hidden');
  els.whitePopupBox.scrollTop = 0;

  const handler = () => {
    els.whitePopupOverlay.removeEventListener('click', handler);
    els.whitePopupOverlay.classList.add('hidden');
    els.whitePopupOverlay.style.zIndex = '';
    if (onClose) onClose();
  };

  setTimeout(() => {
    els.whitePopupOverlay.addEventListener('click', handler);
  }, 0);
}

function triggerGlitchEffect(duration, zIndex){
  if (document.getElementById('glitch-canvas-overlay')) return;
  
  const overlay = document.createElement('div');
  overlay.id = 'glitch-canvas-overlay';
  overlay.style.cssText = `
    position: fixed;
    inset: 0;
    z-index: ${zIndex || 2050};
    pointer-events: none;
    background: rgba(10, 10, 15, 0.6);
  `;
  
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'width:100vw; height:100vh; display:block;';
  overlay.appendChild(canvas);
  document.body.appendChild(overlay);
  
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  
  const startTime = performance.now();
  let colorBlocks = [];
  
  function generateBlocks() {
    colorBlocks = [];
    const count = Math.floor(Math.random() * 80) + 60;
    const colors = [
      '#FF0000', '#00FF00', '#0000FF', '#00FFFF', '#FF00FF', '#FFFF00', '#FFFFFF', '#00FF7F', '#FFA500', '#8A2BE2'
    ];
    for (let i = 0; i < count; i++) {
      const c = colors[Math.floor(Math.random() * colors.length)];
      const bw = Math.random() * w * 0.9 + 10;
      const bh = Math.random() < 0.6 ? Math.random() * 20 + 2 : Math.random() * 100 + 15;
      const bx = Math.random() * w - bw / 2;
      const by = Math.random() * h - bh / 2;
      colorBlocks.push({ x: bx, y: by, w: bw, h: bh, color: c });
    }
  }
  
  generateBlocks();
  let lastGen = startTime;
  
  function draw() {
    const now = performance.now();
    if (now - startTime > duration) {
      overlay.remove();
      els.app.classList.remove('shake');
      return;
    }
    
    if (now - lastGen > 60) {
      generateBlocks();
      lastGen = now;
    }
    
    ctx.clearRect(0, 0, w, h);
    
    // 绘制完全不透明色块
    colorBlocks.forEach(block => {
      ctx.fillStyle = block.color;
      ctx.fillRect(block.x, block.y, block.w, block.h);
    });

    // 绘制一些杂乱的白色噪点/细线
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 100; i++) {
      ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 15 + 1, Math.random() * 3 + 1);
    }

    // 横向拉扯
    for (let i = 0; i < 5; i++) {
        const sy = Math.random() * h;
        const sh = Math.random() * 100 + 20;
        const dx = (Math.random() - 0.5) * 200;
        try {
            const slice = ctx.getImageData(0, sy, w, sh);
            ctx.putImageData(slice, dx, sy);
        } catch(e) {}
    }
    
    requestAnimationFrame(draw);
  }
  
  els.app.classList.add('shake');
  requestAnimationFrame(draw);
  
  setTimeout(() => els.app.classList.remove('shake'), duration);
}

function parseBirthDate(str){
  const nums = String(str).match(/\d+/g);
  if (!nums) return null;
  let month, day;
  if (nums.length >= 3)      { month = +nums[1]; day = +nums[2]; }
  else if (nums.length === 2){ month = +nums[0]; day = +nums[1]; }
  else return null;
  if (month < 1 || month > 12 || day < 1 || day > 31) return null;
  return { month, day };
}

function isBirthdayToday(str){
  const d = parseBirthDate(str);
  if (!d) return false;
  const now = new Date();
  return d.month === (now.getMonth() + 1) && d.day === now.getDate();
}

  }
}

function removeItemSilent(id){
  const idx = state.inventory.indexOf(id);
  if (idx === -1) return false;
  state.inventory.splice(idx, 1);
  Object.keys(state.equipment).forEach(slot => {
    if (state.equipment[slot] === id) state.equipment[slot] = null;
  });
  return true;
}

function addItem(id){
  if (!id || !ITEMS[id]) return;
  if (state.inventory.includes(id)) return;
  state.inventory.push(id);
  if (id === 'glowingWatch') {
    state.equipment.watch = id;
  }

  const hopeId = CARD_TO_HOPE[id];
  if (hopeId) removeItemSilent(hopeId);

  renderInventory();
  showToast(`获得物品：${ITEMS[id].name}`, true);

  if (id === 'studentCard' && state.cardNeedsInput) {
    setTimeout(() => {
      if (state.cardNeedsInput) openStudentCardInput();
    }, 320);
  }
}

function toggleEquip(id){
  const item = ITEMS[id];
  if (!item || !item.slot) return;

  if (state.equipment[item.slot] === id){
    state.equipment[item.slot] = null;
    updateItemDesc(`卸下了 ${item.name}。`);
    renderInventory();
    return;
  }

  if (id === 'watch') {
    startWatchEquipSequence();
    return;
  }

  state.equipment[item.slot] = id;
  updateItemDesc(item.equipDesc || item.desc);
  renderInventory();
}

function renderInventory(){
  if (!els.equipSlots || !els.itemGrid) return;

  els.equipSlots.innerHTML = '';
  const slotDefs = [
    { key:'watch', label:'挂件' },
    { key:'card', label:'证件' },
    { key:'charm', label:'信物' }
  ];
  slotDefs.forEach(def => {
    const equippedId = state.equipment[def.key];
    const div = document.createElement('div');
    div.className = 'equip-slot' + (equippedId ? ' filled' : '');
    if (equippedId && ITEMS[equippedId]){
      const item = ITEMS[equippedId];
      const icon = document.createElement('span');
      icon.className = 'equip-icon';
      icon.textContent = item.icon;
      const name = document.createElement('span');
      name.className = 'equip-name';
      name.textContent = item.name;
      div.append(icon, name);
      div.addEventListener('click', () => {
        state.equipment[def.key] = null;
        updateItemDesc(`卸下了 ${item.name}。`);
        renderInventory();
      });
    } else {
      const label = document.createElement('span');
      label.className = 'equip-empty';
      label.textContent = def.label;
      div.appendChild(label);
    }
    els.equipSlots.appendChild(div);
  });

  els.itemGrid.innerHTML = '';
  if (state.inventory.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '还没有任何物品';
    els.itemGrid.appendChild(hint);
    return;
  }

  state.inventory.forEach(id => {
    const item = ITEMS[id];
    if (!item) return;
    const equipped = Object.values(state.equipment).includes(id);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'item-cell' + (equipped ? ' equipped' : '');

    const icon = document.createElement('span');
    icon.className = 'item-icon';
    icon.textContent = item.icon;

    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = item.name;

    btn.append(icon, name);

    btn.addEventListener('click', () => {
      updateItemDesc(item.desc);

      if (id === 'handbook') {
        showHandbookConfirm();
        return;
      }

      if (id === 'studentCard') {
        if (state.cardNeedsInput || !state.playerName) openStudentCardInput();
        else openStudentCardView();
        return;
      }

      /* 🎮 通关手册：白底黑字弹窗 */
      if (id === 'hintManual') {
        showWhitePopup(HINT_MANUAL_TEXT, null, '#000000');
        return;
      }

      if (item.slot) toggleEquip(id);
    });

    els.itemGrid.appendChild(btn);
  });
}

function renderEndingCollection(){
  if (!els.endingCollectionList) return;
  const list = els.endingCollectionList;
  list.innerHTML = '';

  let total = 0;
  let unlocked = 0;

  ENDING_GROUPS.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'collect-group';

    const titleEl = document.createElement('div');
    titleEl.className = 'collect-group-title';
    titleEl.textContent = group.title;
    groupEl.appendChild(titleEl);

    group.keys.forEach((key, i) => {
      const e = DATA.endings[key];
      if (!e) return;
      total++;
      const isUnlocked = collectedEndings.has(key);
      if (isUnlocked) unlocked++;

      const item = document.createElement('div');
      item.className = 'collect-item ' + (isUnlocked ? 'unlocked' : 'locked');

      const idx = document.createElement('span');
      idx.className = 'collect-index';
      idx.textContent = isUnlocked ? '✓' : String(i + 1);

      const title = document.createElement('div');
      title.className = 'collect-title';

      if (isUnlocked){
        const nameEl = document.createElement('div');
        nameEl.textContent = applyName(e.title || '');
        const kindEl = document.createElement('div');
        kindEl.className = 'collect-kind';
        kindEl.textContent = e.kind || '';
        title.append(nameEl, kindEl);
      } else {
        title.textContent = '？？？';
      }

      item.append(idx, title);
      groupEl.appendChild(item);
    });

    list.appendChild(groupEl);
  });

  if (els.endingCollectionProgress){
    els.endingCollectionProgress.textContent = `已收集 ${unlocked} / ${total}`;
  }
}

function loadChapter(id){
  const ch = DATA.chapters[id];
  if (!ch) return;

  const prevRoute = state.routeId;
  const newRoute  = ch.route || null;

  if (!(prevRoute === 'A' && newRoute === 'A')) {
    clearWhispers();
  }

  state.currentId = id;
  state.routeId   = newRoute;

  if (ch.items && ch.items.length > 0) {
    ch.items.forEach(itemId => addItem(itemId));
  }

  if (ch.unequipWatch && state.equipment.watch === 'watch') {
    state.equipment.watch = null;
    renderInventory();
    updateItemDesc('你的怀表不知何时被取下了。');
    showWatchRemovedToast();
  }

  if (ch.route) {
    const route = DATA.routes[ch.route];
    state.partIndex = ch.part - 1;

    els.chapterLabel.textContent =
      `${route.label} · 第 ${ch.part} / ${route.parts.length} 部分`;
    els.progressFill.style.width =
      `${(ch.part / route.parts.length) * 100}%`;
  } else {
    els.chapterLabel.textContent = '序 章';
    els.progressFill.style.width = '0%';
  }

  els.chapterTitle.textContent = ch.title;
  els.storyText.innerHTML = renderClickableNames(ch.text);

  replay(els.chapterTitle);
  replay(els.storyText);

  if (ch.options && ch.options.length > 0) {
    renderOptions(ch.options, ch);
  } else if (ch.continueTo) {
    renderContinue(ch);
  } else {
    els.options.innerHTML = '';
  }
}

function renderOptions(options, ch){
  els.options.innerHTML = '';

  const isARoute = ch && ch.route === 'A' && ch.part !== 1;

  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.style.animationDelay = `${0.08 + i * 0.07}s`;

    const num = document.createElement('span');
    num.className = 'opt-num';
    num.textContent = String(i + 1);

    const txt = document.createElement('span');
    txt.className = 'opt-text';
    txt.textContent = opt.text;

    btn.append(num, txt);
    btn.addEventListener('click', () => choose(opt, btn, i, isARoute));
    els.options.appendChild(btn);
  });
}

function renderContinue(ch){
  els.options.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'continue-wrap';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'continue-btn';
  btn.textContent = '继续剧情';

  btn.addEventListener('click', () => {
    if (state.locked) return;
    state.locked = true;

    els.content.classList.add('is-fading');

    setTimeout(() => {
      if (ch.continueTo === '__CHECK_D_END__') {
        const requiredCards = [
          'himekoCard','kafkaCard','bladeCard','danhengCard',
          'marchCard','fireflyCard','sundayCard','silverwolfCard',
          'weltCard','blackCatCard'
        ];
        const hasAll = requiredCards.every(id => state.inventory.includes(id));
        els.content.classList.remove('is-fading');
        if (hasAll) {
          showEnding('D_END');
        } else {
          resolveRouteEnding();
        }
        state.locked = false;
        return;
      }
      if (ch.continueTo === '__ROUTE_END__') {
        els.content.classList.remove('is-fading');
        resolveRouteEnding();
        state.locked = false;
        return;
      }
      loadChapter(ch.continueTo);
      els.content.classList.remove('is-fading');
      state.locked = false;
    }, 200);
  });

  wrap.appendChild(btn);
  els.options.appendChild(wrap);
}

function advanceTo(opt){
  state.locked = true;

  if (opt.item) addItem(opt.item);

  if (opt.ending) {
    showEnding(opt.ending);
    return;
  }

  state.score += (opt.score || 0);

  if (!opt.next) { state.locked = false; return; }

  els.content.classList.add('is-fading');

  setTimeout(() => {
    if (opt.next === '__ROUTE_END__') {
      els.content.classList.remove('is-fading');
      resolveRouteEnding();
    } else {
      loadChapter(opt.next);
      els.content.classList.remove('is-fading');
      state.locked = false;
    }
  }, 200);
}

function showManualContinue(opt){
  els.options.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'continue-wrap';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'continue-btn';
  btn.textContent = '继续剧情';

  btn.addEventListener('click', () => {
    if (state.locked) return;
    advanceTo(opt);
  });

  wrap.appendChild(btn);
  els.options.appendChild(wrap);
}

function choose(opt, btn, index, isARoute){
  if (state.locked) return;

  if ((state.routeId === 'A' || state.routeId === 'B') && index === 2){
    const cur = state.currentId;
    let target = null;

    if ((cur === 'A1b' || cur === 'B1_5') &&
        state.inventory.includes('bladeHope') &&
        state.inventory.includes('danhengHope')){
      target = state.routeId === 'A' ? 'AD1' : 'BD1';
      addItem('danhengCard');
      addItem('bladeCard');
    }
    else if ((cur === 'A2' || cur === 'B2') &&
        state.inventory.includes('marchHope') &&
        state.inventory.includes('fireflyHope')){
      target = state.routeId === 'A' ? 'AD2' : 'BD2';
      addItem('marchCard');
      addItem('fireflyCard');
    }
    else if ((cur === 'A3' || cur === 'B3') &&
        state.inventory.includes('sundayHope') &&
        state.inventory.includes('silverwolfHope')){
      target = state.routeId === 'A' ? 'AD3' : 'BD3';
      addItem('sundayCard');
      addItem('silverwolfCard');
    }
    else if ((cur === 'A4' || cur === 'B4') &&
        state.inventory.includes('weltHope') &&
        state.inventory.includes('blackCatHope')){
      target = state.routeId === 'A' ? 'AD4' : 'BD4';
      addItem('weltCard');
      addItem('blackCatCard');
    }

    if (target){
      state.locked = true;
      els.content.classList.add('is-fading');
      setTimeout(() => {
        loadChapter(target);
        els.content.classList.remove('is-fading');
        state.locked = false;
      }, 200);
      return;
    }
  }

  if (
    state.routeId === 'B' &&
    !SLEEP_WHISPER_EXCLUDE_IDS.includes(state.currentId) &&
    state.equipment.watch !== 'glowingWatch'
  ) {
    const isDOption = opt.text.trim().startsWith('D');
    if (!isDOption) {
      triggerSleepWhisper();
      return;
    }
  }

  if (state.routeId === 'B') {
    if (state.currentId === 'B1_5') {
      if (index === 0) state.bParts.a1 = true;
      if (index === 1) state.bParts.b1 = true;
      if (index === 3) state.bParts.d1 = true;
    }
    if (state.currentId === 'B2') {
      if (index === 0) state.bParts.a2 = true;
      if (index === 1) state.bParts.b2 = true;
      if (index === 3) state.bParts.d2 = true;
    }
    if (state.currentId === 'B3') {
      if (index === 0) state.bParts.a3 = true;
      if (index === 1) state.bParts.b3 = true;
      if (index === 3) state.bParts.d3 = true;
    }
    if (state.currentId === 'B4') {
      if (index === 0) state.bParts.a4 = true;
      if (index === 1) state.bParts.b4 = true;
      if (index === 3) state.bParts.d4 = true;
    }
  }

  if (opt.b1Action) {
    if (opt.b1Action === 'A' && state.sawRedPopup) {
      showToast("……真的么？");
    } else if (opt.b1Action === 'B' && !state.sawRedPopup) {
      showToast("我看得到，别撒谎。");
    } else if (opt.b1Action === 'C') {
      showToast("……下次别这样");
    }
    advanceTo(opt);
    return;
  }

  if (opt.cFakePopup) {
    state.locked = true;
    showPopup(opt.cFakePopup, () => {
      state.locked = false;
    });
    return;
  }

  if (isARoute && state.equipment.watch !== 'watch') {
    if (index !== 0) {
      triggerWhisper(btn);
      return;
    }
  }

  if (state.routeId === 'C' && C_ONLY_D_IDS.includes(state.currentId)) {
    if (index !== 3) {
      const rect = btn.getBoundingClientRect();
      spawnCTiredText(rect.left + rect.width / 2, rect.top + rect.height / 2);
      return;
    }
  }

  if (state.routeId === 'A') {
    const letter = ['A', 'B', 'C', 'D'][index] || null;
    if (state.currentId === 'A1b') state.aParts.a1b = letter;
    else if (state.currentId === 'A2') state.aParts.a2 = letter;
    else if (state.currentId === 'A3') state.aParts.a3 = letter;
    else if (state.currentId === 'A4') state.aParts.a4 = letter;
  }

  if (opt.whisper) {
    triggerWhisper(btn);
    return;
  }

  if (opt.popup) {
    state.locked = true;
    showPopup(opt.popup, () => {
      state.locked = false;
      advanceTo(opt);
    });
    return;
  }

  if (state.routeId === 'A' && A_MANUAL_CONTINUE_IDS.includes(state.currentId)) {
    showManualContinue(opt);
    return;
  }

  advanceTo(opt);
}

function resolveRouteEnding(){
  if (state.routeId === 'B') {
    const { a1, a2, a3, a4, b1, b2, b3, b4, d1, d2, d3, d4 } = state.bParts;
    const countA = [a1, a2, a3, a4].filter(Boolean).length;
    const countB = [b1, b2, b3, b4].filter(Boolean).length;
    const countD = [d1, d2, d3, d4].filter(Boolean).length;
    let key;

    if (countB === 4) {
      key = 'B_END_6';
    } else if (countB === 0 && countD === 4) {
      key = 'B_END_8';
    } else if (countB === 0 && countD < 4) {
      key = 'B_END_5';
    } else if (countA === 1) {
      if (a1) key = 'B_END_1';
      else if (a2) key = 'B_END_2';
      else if (a3) key = 'B_END_3';
      else if (a4) key = 'B_END_4';
    } else {
      key = 'B_END_7';
    }

    if (key === 'B_END_8') {
      startEightEnding();
    } else {
      showEnding(key);
    }
    return;
  }

  if (state.routeId === 'A') {
    const parts = [state.aParts.a1b, state.aParts.a2, state.aParts.a3, state.aParts.a4];
    const allA  = parts.every(p => p === 'A');
    const bCount = parts.filter(p => p === 'B').length;
    let key;

    if (allA) {
      key = 'A_END';
    } else if (bCount === 0) {
      key = 'A_END_5';
    } else if (bCount === 1) {
      if (state.aParts.a1b === 'B') key = 'A_END_1';
      else if (state.aParts.a2 === 'B') key = 'A_END_2';
      else if (state.aParts.a3 === 'B') key = 'A_END_3';
      else key = 'A_END_4';
    } else {
      key = 'B_END_7';
    }

    showEnding(key);
    return;
  }

  const rule = DATA.routeEndings[state.routeId];
  if (!rule) return;

  let key;
  if (rule.type === 'fixed') {
    key = rule.ending;
  } else {
    const hit = rule.rules.find(r => state.score >= r.min);
    key = hit ? hit.ending : rule.rules[rule.rules.length - 1].ending;
  }
  showEnding(key);
}

/* --- 碎裂效果 --- */

function playShatter(bgGradient, glowColor, duration){
  return new Promise(resolve => {
    const dur = duration || 1500;
    const overlay = document.createElement('div');
    overlay.className = 'c-seq-overlay';
    overlay.style.zIndex = '3600';
    overlay.style.pointerEvents = 'none';
    overlay.style.overflow = 'hidden';
    document.body.appendChild(overlay);

    const w = window.innerWidth;
    const h = window.innerHeight;
    const cx = w / 2;
    const cy = h / 2;
    const maxR = Math.hypot(w, h);
    const numPieces = 16;

    for (let i = 0; i < numPieces; i++){
      const a1 = (i / numPieces) * Math.PI * 2;
      const a2 = ((i + 1) / numPieces) * Math.PI * 2;
      const j1 = (Math.random() - 0.5) * 0.14;
      const j2 = (Math.random() - 0.5) * 0.14;
      const r1 = maxR * (0.5 + Math.random() * 0.5);
      const r2 = maxR * (0.5 + Math.random() * 0.5);

      const x1 = cx + Math.cos(a1 + j1) * r1;
      const y1 = cy + Math.sin(a1 + j1) * r1;
      const x2 = cx + Math.cos(a2 + j2) * r2;
      const y2 = cy + Math.sin(a2 + j2) * r2;

      const piece = document.createElement('div');
      piece.style.cssText = `
        position:absolute;
        inset:0;
        background: ${bgGradient};
        clip-path: polygon(${cx}px ${cy}px, ${x1}px ${y1}px, ${x2}px ${y2}px);
        transition: transform ${dur / 1000}s cubic-bezier(.4,0,.2,1), opacity ${dur / 1000}s ease;
        filter: drop-shadow(0 0 8px ${glowColor});
      `;
      overlay.appendChild(piece);

      const dx = (Math.random() - 0.5) * 400;
      const dy = h * (0.5 + Math.random() * 0.6);
      const rot = (Math.random() - 0.5) * 110;

      requestAnimationFrame(() => {
        setTimeout(() => {
          piece.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
          piece.style.opacity = '0';
        }, 30 + i * 22);
      });
    }

    setTimeout(() => {
      overlay.remove();
      resolve();
    }, 30 + numPieces * 22 + dur + 200);
  });
}

/* --- 屏幕碎裂：裂纹层，可一直持续到调用 shatterAway --- */

function showScreenCrack(){
  const overlay = document.createElement('div');
  overlay.className = 'c-screen-crack';
  overlay.style.cssText =
    'position:fixed;inset:0;z-index:3300;pointer-events:none;overflow:hidden;';

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
  overlay.appendChild(canvas);
  document.body.appendChild(overlay);

  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let viewW = 0, viewH = 0;
  let cracks = { lines: [], rings: [] };
  let impact = { x: 0, y: 0 };

  function rand(a, b){ return a + Math.random() * (b - a); }

  function build(){
    viewW = window.innerWidth;
    viewH = window.innerHeight;

    canvas.width  = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));
    canvas.style.width  = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cx = viewW / 2;
    const cy = viewH / 2;
    impact = { x: cx, y: cy };

    const maxR = Math.hypot(viewW, viewH);
    const lines = [];
    const rings = [];

    // 1. 放射状主裂纹（严格直线，减少数量）
    const mainCount = 12; 
    const mainAngles = [];
    for (let i = 0; i < mainCount; i++) {
      const baseAngle = (i / mainCount) * Math.PI * 2 + rand(-0.15, 0.15);
      mainAngles.push(baseAngle);
      
      // 主裂纹（几条很长的直线）
      const len = maxR * rand(0.8, 1.2);
      const endX = cx + Math.cos(baseAngle) * len;
      const endY = cy + Math.sin(baseAngle) * len;
      lines.push({ points: [{x: cx, y: cy}, {x: endX, y: endY}], width: rand(2.5, 4.0), alpha: 0.95 });
    }

    // 2. 同心环形裂纹（多边形，顶点在主裂纹上，线段为直线）
    const ringCount = 3;
    for (let r = 1; r <= ringCount; r++) {
      const baseR = (Math.min(viewW, viewH) * 0.5) * (r / (ringCount + 0.5));
      const pts = [];
      // 遍历所有主裂纹的角度，确定环形的顶点
      for (let i = 0; i < mainCount; i++) {
        const a = mainAngles[i];
        const rr = baseR * rand(0.85, 1.15);
        pts.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr });
      }
      // 闭合多边形
      pts.push(pts[0]);
      rings.push(pts);
    }

    // 3. 分叉直线（增加真实感，但不要太多）
    for (let i = 0; i < mainCount; i++) {
      if (Math.random() < 0.6) {
        const a = mainAngles[i];
        const startR = Math.min(viewW, viewH) * 0.3;
        const startX = cx + Math.cos(a) * startR;
        const startY = cy + Math.sin(a) * startR;
        
        const ba = a + (Math.random() < 0.5 ? 1 : -1) * rand(0.4, 0.8);
        const bLen = maxR * rand(0.2, 0.4);
        const endX = startX + Math.cos(ba) * bLen;
        const endY = startY + Math.sin(ba) * bLen;
        
        lines.push({ points: [{x: startX, y: startY}, {x: endX, y: endY}], width: rand(1.2, 2.0), alpha: 0.7 });
      }
    }

    cracks = { lines, rings };
    draw();
  }

  function drawLine(points, width, alpha){
    if (points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.lineJoin = 'miter';
    ctx.lineCap  = 'butt';

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(8,12,24,0.85)';
    ctx.lineWidth = width + 2.5;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(235,245,255,' + alpha + ')';
    ctx.lineWidth = width;
    ctx.shadowColor = 'rgba(180,220,255,1)';
    ctx.shadowBlur = 10;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, alpha + 0.1) + ')';
    ctx.lineWidth = Math.max(0.8, width * 0.4);
    ctx.shadowBlur = 4;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function draw(){
    ctx.clearRect(0, 0, viewW, viewH);

    const haloR = Math.min(viewW, viewH) * 0.25;
    const halo = ctx.createRadialGradient(impact.x, impact.y, 0, impact.x, impact.y, haloR);
    halo.addColorStop(0,   'rgba(240,250,255,0.8)');
    halo.addColorStop(0.2, 'rgba(200,230,255,0.4)');
    halo.addColorStop(1,   'rgba(150,200,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(impact.x, impact.y, haloR, 0, Math.PI * 2);
    ctx.fill();

    cracks.rings.forEach(pts => {
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.lineJoin = 'miter';
      ctx.strokeStyle = 'rgba(8,12,24,0.75)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(230,245,255,0.85)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = 'rgba(180,220,255,1)';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    });

    cracks.lines.slice().sort((a, b) => a.width - b.width)
      .forEach(l => drawLine(l.points, l.width, l.alpha));

    ctx.beginPath();
    ctx.arc(impact.x, impact.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.shadowColor = 'rgba(200,230,255,1)';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  build();

  const onResize = () => build();
  window.addEventListener('resize', onResize);

  return {
    el: overlay,

    shatterAway(){
      return new Promise(resolve => {
        let url = '';
        try {
          const snap = document.createElement('canvas');
          snap.width  = Math.max(1, Math.round(viewW));
          snap.height = Math.max(1, Math.round(viewH));
          const sctx = snap.getContext('2d');
          sctx.drawImage(canvas, 0, 0, snap.width, snap.height);
          url = snap.toDataURL('image/png');
        } catch (e){ url = ''; }

        canvas.style.animation = 'none';
        canvas.style.display = 'none';

        overlay.style.pointerEvents = 'auto';

        const cx = impact.x;
        const cy = impact.y;
        const maxR = Math.hypot(viewW, viewH) * 1.15;

        const N = 20;
        const M = 5;
        const jitter = Math.min(viewW, viewH) * 0.04;

        const grid = [];
        for (let i = 0; i <= N; i++){
          const a = (i / N) * Math.PI * 2;
          const row = [{ x: cx, y: cy }];
          for (let j = 1; j <= M; j++){
            const r  = maxR * Math.pow(j / M, 0.9);
            const jx = (i === 0 || i === N) ? 0 : rand(-jitter, jitter) * (j/M);
            const jy = (i === 0 || i === N) ? 0 : rand(-jitter, jitter) * (j/M);
            row.push({
              x: cx + Math.cos(a) * r + jx,
              y: cy + Math.sin(a) * r + jy
            });
          }
          grid.push(row);
        }
        for (let j = 1; j <= M; j++) grid[N][j] = grid[0][j];

        const anims = [];

        for (let i = 0; i < N; i++){
          for (let j = 0; j < M; j++){
            const pts = (j === 0)
              ? [grid[i][0], grid[i + 1][1], grid[i][1]]
              : [grid[i][j], grid[i + 1][j], grid[i + 1][j + 1], grid[i][j + 1]];

            let px = 0, py = 0;
            pts.forEach(p => { px += p.x; py += p.y; });
            const gx = px / pts.length;
            const gy = py / pts.length;

            const poly = pts.map(p => `${p.x.toFixed(1)}px ${p.y.toFixed(1)}px`).join(',');

            const el = document.createElement('div');
            el.style.cssText = `
              position:absolute;
              left:0; top:0;
              width:100%; height:100%;
              clip-path: polygon(${poly});
              -webkit-clip-path: polygon(${poly});
              background-image: ${url ? `url(${url}), ` : ''}linear-gradient(135deg, rgba(190,215,255,0.10), rgba(120,160,255,0.035));
              background-size: ${viewW}px ${viewH}px, 100% 100%;
              background-position: 0 0, 0 0;
              background-repeat: no-repeat, no-repeat;
              box-shadow: inset 0 0 26px rgba(190,220,255,0.16);
              transform-origin: ${gx.toFixed(1)}px ${gy.toFixed(1)}px;
              will-change: transform, opacity;
              pointer-events: none;
            `;
            overlay.appendChild(el);

            const dx  = (gx - cx) * 0.28 + rand(-36, 36);
            const dy  = Math.max(viewH * 0.65, viewH - gy + viewH * rand(0.2, 0.5));
            const rot = rand(-60, 60);
            const dur = 900 + Math.random() * 700;
            const delay = Math.random() * 180 + j * 55;

            const anim = el.animate([
              { transform: 'translate(0px, 0px) rotate(0deg)', opacity: 1, filter: 'blur(0px)' },
              {
                transform: `translate(${(dx * 0.35).toFixed(1)}px, ${(dy * 0.2).toFixed(1)}px) rotate(${(rot * 0.3).toFixed(1)}deg)`,
                opacity: 1,
                offset: 0.28
              },
              {
                transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${rot.toFixed(1)}deg)`,
                opacity: 0,
                filter: 'blur(0.4px)'
              }
            ], {
              duration: dur,
              delay: delay,
              easing: 'cubic-bezier(.42,.02,.74,.55)',
              fill: 'forwards'
            });

            anims.push(anim.finished.catch(() => {}));
          }
        }

        Promise.all(anims).then(() => {
          window.removeEventListener('resize', onResize);
          overlay.remove();
          resolve();
        });
      });
    },

    remove(){
      window.removeEventListener('resize', onResize);
      overlay.remove();
    }
  };
}

/* --- 抖动红字 --- */

function showCShakingRedText(text, duration){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'c-seq-overlay';
    overlay.style.zIndex = '3500';
    overlay.style.display = 'flex';
    overlay.style.alignItems = 'center';
    overlay.style.justifyContent = 'center';
    overlay.style.padding = '40px';
    overlay.style.cursor = 'pointer';

    const container = document.createElement('div');
    container.style.cssText = `
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      max-width:90vw;
      font-family:"Noto Serif SC","Songti SC",serif;
      font-size:clamp(24px, 5vw, 40px);
      font-weight:900;
      color:#e53935;
      text-shadow:0 0 12px rgba(229,57,53,0.9), 0 0 28px rgba(229,57,53,0.5);
      letter-spacing:0.08em;
      line-height:1.5;
    `;
    overlay.appendChild(container);

    const chars = [...text];
    const charEls = chars.map((ch) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.cssText = `
        display:inline-block;
        opacity:0;
        transition:opacity 0.3s ease;
        will-change:transform;
      `;
      if (ch === ' ') span.style.width = '0.4em';
      container.appendChild(span);
      return span;
    });

    const perChar = duration / Math.max(1, chars.length);
    charEls.forEach((span, i) => {
      setTimeout(() => {
        span.style.opacity = '1';
        span.style.animation = 'textShake 0.12s infinite alternate';
        span.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      }, i * perChar);
    });

    let canClick = false;
    setTimeout(() => {
      canClick = true;
      const hint = document.createElement('div');
      hint.style.cssText = 'position:absolute;bottom:8%;left:50%;transform:translateX(-50%);color:rgba(229,57,53,0.75);font-size:14px;letter-spacing:0.3em;animation:popupFadeIn .6s ease both;';
      hint.textContent = '▼';
      overlay.appendChild(hint);
      setTimeout(() => { hint.style.animation = 'popupFadeIn 1.2s ease-in-out infinite alternate'; }, 50);
    }, duration);

    overlay.addEventListener('click', () => {
      if (!canClick) return;
      overlay.style.transition = 'opacity 0.4s';
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.remove();
        resolve();
      }, 420);
    });

    document.body.appendChild(overlay);
  });
}

/* --- 紫色发光线条（交叉直线切割版） --- */

function showPurpleThreads(){
  const overlay = document.createElement('div');
  overlay.className = 'c-seq-overlay';
  overlay.style.zIndex = '3400';
  overlay.style.pointerEvents = 'none';
  overlay.style.overflow = 'hidden';

  const w = window.innerWidth;
  const h = window.innerHeight;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
  overlay.appendChild(svg);

  // 生成大量不规则的直线进行交叉切割
  const numLines = 25;
  for (let i = 0; i < numLines; i++){
    const line = document.createElementNS(ns, 'line');
    
    // 随机决定这根线是偏水平还是偏垂直，形成交错切割感
    let angle;
    if (Math.random() < 0.5) {
      // 偏水平，角度范围 -30度 到 30度
      angle = (Math.random() - 0.5) * Math.PI / 3;
    } else {
      // 偏垂直，角度范围 60度 到 120度
      angle = Math.PI / 2 + (Math.random() - 0.5) * Math.PI / 3;
    }

    // 把线拉长，确保能横穿屏幕
    const length = Math.hypot(w, h) * 2;
    const cx = w / 2 + (Math.random() - 0.5) * w * 0.8;
    const cy = h / 2 + (Math.random() - 0.5) * h * 0.8;
    
    const x1 = cx - Math.cos(angle) * length / 2;
    const y1 = cy - Math.sin(angle) * length / 2;
    const x2 = cx + Math.cos(angle) * length / 2;
    const y2 = cy + Math.sin(angle) * length / 2;

    line.setAttribute('x1', x1.toFixed(1));
    line.setAttribute('y1', y1.toFixed(1));
    line.setAttribute('x2', x2.toFixed(1));
    line.setAttribute('y2', y2.toFixed(1));
    
    // 颜色使用紫色系，有深有浅
    const colors = ['#a855f7', '#7c3aed', '#c084fc', '#8b5cf6'];
    line.setAttribute('stroke', colors[Math.floor(Math.random() * colors.length)]);
    
    // 线宽随机，从极细到粗，制造错落感
    const width = Math.random() < 0.3 ? (Math.random() * 1.5 + 0.5) : (Math.random() * 3.5 + 2);
    line.setAttribute('stroke-width', width.toFixed(1));
    
    // 加上发光滤镜
    line.style.filter = 'drop-shadow(0 0 5px #a855f7) drop-shadow(0 0 15px #7c3aed)';
    
    // 动画：一开始消失，然后极快地生长，像是光剑切开屏幕
    line.style.opacity = '0';
    line.style.transition = `opacity ${0.3 + Math.random() * 0.4}s ease ${i * 0.05}s, stroke-dashoffset ${0.4 + Math.random() * 0.4}s ease-out ${i * 0.05}s`;
    
    // 利用虚线偏移实现“生长”效果
    try {
      const len = Math.hypot(x2 - x1, y2 - y1);
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      requestAnimationFrame(() => {
        line.style.strokeDashoffset = '0';
        line.style.opacity = '1';
      });
    } catch (e) {
      line.style.opacity = '1';
    }

    svg.appendChild(line);
  }

  document.body.appendChild(overlay);
  return overlay;
}

/* --- 主序列 --- */

async function playCMirrorShatterSequence(){
  if (cSequenceRunning) return;
  cSequenceRunning = true;
  els.restartBtn.disabled = true;

  let crackLayer = null;
  let threadsOverlay = null;

  try {
    crackLayer = showScreenCrack();
    await sleep(1100);

    await showCShakingRedText('你又能做到什么呢？', 10000);

    await showCShakingRedText('你就这么希望他们再一次为你牺牲吗？', 15000);

    threadsOverlay = showPurpleThreads();
    await sleep(1800);

    await showPurplePopup('听我说，宝贝，这一切都不怪你。');

    await showPurplePopup('所以，你只需要努力，找到那个“完美结局”就好了。');

    if (threadsOverlay){
      const t = threadsOverlay;
      threadsOverlay = null;
      t.style.transition = 'opacity 0.6s ease';
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 700);
      await sleep(680);
    }

    restart();

    await sleep(80);

    if (crackLayer){
      const layer = crackLayer;
      crackLayer = null;
      await layer.shatterAway();
    }
  } finally {
    if (crackLayer) crackLayer.remove();
    if (threadsOverlay) threadsOverlay.remove();
    cSequenceRunning = false;
    els.restartBtn.disabled = false;
  }
}

function exitPage(){

  try { window.open('about:blank', '_self'); } catch (e) {}
  try { window.close(); } catch (e) {}
  // 兜底：直接跳转到空白页，等价于“退出游戏”
  try { window.location.replace('about:blank'); } catch (e) {}
  // 极端情况下的最后兜底
  setTimeout(() => {
    try { document.body.innerHTML = ''; } catch (e) {}
    try { window.location.href = 'about:blank'; } catch (e) {}
  }, 120);
}

      cRestartReadyForMirror = false;
      playCMirrorShatterSequence();

  if (FIRE_ENDINGS.has(endingKey)) {
    const e = DATA.endings[endingKey];
    const titleText = applyName(e.title || '');
    const kindText  = e.kind || '';
    const bodyText  = applyName(e.text || '');

      els.restartBtn.disabled = false;

    els.restartBtn.disabled = true;

els.birthdayOverlay.addEventListener('click', () => {
  els.birthdayOverlay.classList.add('hidden');
});

els.watchConfirmYes.addEventListener('click', () => {
  if (watchConfirmStep === 1) {
    watchConfirmStep = 2;
    els.watchConfirmBox.style.background = '#ffffff';
    els.watchConfirmBox.style.color = '#7b1fa2';
    els.watchConfirmText.style.color = '#7b1fa2';
    els.watchConfirmText.textContent = '是否装备怀表？';
    return;
  }

  if (watchConfirmStep === 2) {
    watchConfirmStep = 3;
    els.watchConfirmBox.style.background = '#d32f2f';
    els.watchConfirmBox.style.color = '#000000';
    els.watchConfirmText.style.color = '#000000';
    els.watchConfirmText.textContent = '是否装备怀表？';
    return;
  }

  if (watchConfirmStep === 3) {
    els.watchConfirmOverlay.classList.add('hidden');
    watchConfirmStep = 0;

    state.equipment.watch = 'watch';
    state.watchEverEquipped = true;
    updateItemDesc(ITEMS.watch.equipDesc || ITEMS.watch.desc);
    renderInventory();

    showPurpleToast('你真的，不愿意听我说吗？', 3000);

    setTimeout(() => {
      triggerSnowGlitch(1000); 
    }, 3000);
  }
});

els.watchConfirmNo.addEventListener('click', () => {
  els.watchConfirmOverlay.classList.add('hidden');
  watchConfirmStep = 0;
  resetWatchConfirmStyle();
});

els.inventoryToggle.addEventListener('click', () => {
  const isHidden = els.inventoryPanel.classList.contains('hidden');
  els.endingCollectionPanel.classList.add('hidden');
  els.inventoryPanel.classList.toggle('hidden');
  if (isHidden) renderInventory();
});

els.invClose.addEventListener('click', () => {
  els.inventoryPanel.classList.add('hidden');
});

els.endingCollectionToggle.addEventListener('click', () => {
  const isHidden = els.endingCollectionPanel.classList.contains('hidden');
  els.inventoryPanel.classList.add('hidden');
  els.endingCollectionPanel.classList.toggle('hidden');
  if (isHidden) renderEndingCollection();
});

els.endingCollectionClose.addEventListener('click', () => {
  els.endingCollectionPanel.classList.add('hidden');
});

/* ================================================================
   🎮 提示按钮事件
   ================================================================ */

els.hintToggle.addEventListener('click', () => {
  openHintPopup();
});

els.hintPopupYes.addEventListener('click', () => {
  closeHintPopup();
  // “拜托了狼尊大人！”→ 白底灰字弹窗，关闭后获得通关手册
  setTimeout(() => {
    showWhitePopup(HINT_POPUP_GIVE, () => {
      addItem('hintManual');
    }, '#666666');
  }, 80);
});

els.hintPopupNo.addEventListener('click', () => {
  closeHintPopup();
  // “我自己来！”→ 白底灰字弹窗
  setTimeout(() => {
    showWhitePopup(HINT_POPUP_SELF, null, '#666666');
  }, 80);
});

/* ===== 初始化：首次加载显示前置声明，否则直接开始 ===== */
if (!hasShownIntro) {
  showIntroDeclaration();
} else {
  renderInventory();
  loadChapter(DATA.startId);
}

updateHintToggleVisibility();

</script>

</body>
</html>
